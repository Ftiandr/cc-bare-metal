# /etc/lock.conf - the auto-lock of the computer's screen (man users)
# After this long without input the screen is locked; the password of the user who logged in (or root's)
# unlocks it. For everyone who logs in with a password: 300 (seconds), 90s, 5m, 1h; 0 = never.
# Each user can change it for the session with lock -t (for example in ~/.profile).
LOCK_AFTER=0
