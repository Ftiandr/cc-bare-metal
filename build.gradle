plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    maven {
        name = "SquidDev"
        url = "https://maven.squiddev.cc"
        content {
            includeGroup("cc.tweaked")
            includeModule("org.squiddev", "Cobalt")
        }
    }
    mavenCentral()
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // new computers skip the first-boot setup: account "user" without a password, logged in automatically
            systemProperty 'ccbaremetal.unattendedSetup', 'true'
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Unit tests run inside a FML environment, so kernel tests can use Minecraft and CC classes.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // CC: Tweaked - hard dependency, we are an addon (peripherals, mounts, Lua via Cobalt).
    implementation "cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cc_version}"
    // Cobalt (the Lua VM used by CC) ships inside the CC jar; we only need it to compile against.
    compileOnly "cc.tweaked:cobalt:0.9.9"

    // Chicory: pure-Java WebAssembly runtime (no natives -> runs anywhere the JVM runs).
    // ASM is provided by NeoForge at runtime, so we exclude it from the bundled jars.
    ["runtime", "wasm", "compiler"].each { name ->
        jarJar(implementation("com.dylibso.chicory:${name}")) {
            version {
                strictly "[${chicory_version},2.0)"
                prefer chicory_version
            }
            exclude group: "org.ow2.asm"
        }
        additionalRuntimeClasspath("com.dylibso.chicory:${name}:${chicory_version}") {
            exclude group: "org.ow2.asm"
        }
    }

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    maxHeapSize = providers.gradleProperty("testHeap").getOrElse("2g")
    systemProperty "ccbaremetal.jitCache", providers.gradleProperty("jitCache").getOrElse("")
    systemProperty "ccbaremetal.unattendedSetup", "true"
    testLogging { showStandardStreams = true }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            cc_version             : cc_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata

// The guest system image (userland/ builds src/main/rootfs) is shipped as one zip inside the jar.
def rootfsOut = layout.buildDirectory.dir("generated/rootfs")
var zipRootfs = tasks.register("zipRootfs", Zip) {
    from "src/main/rootfs"
    archiveFileName = "system.zip"
    destinationDirectory = rootfsOut.map { it.dir("ccbaremetal") }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
// The in-game C/C++ toolchain (clang + sysroot, ~100 MB): assembled by userland/build-toolchain.sh from tools/,
// shipped as ccbaremetal/toolchain.zip and unpacked on the server at first use.
def toolchainDir = layout.buildDirectory.dir("toolchain")
var assembleToolchain = tasks.register("assembleToolchain", Exec) {
    description = "Assembles the in-game clang toolchain into build/toolchain"
    commandLine "sh", "userland/build-toolchain.sh"
    inputs.file("userland/build-toolchain.sh")
    outputs.dir(toolchainDir)
}
var zipToolchain = tasks.register("zipToolchain", Zip) {
    dependsOn assembleToolchain, "precompileToolchain"
    from toolchainDir
    from layout.buildDirectory.dir("toolchain-slim")
    archiveFileName = "toolchain.zip"
    destinationDirectory = layout.buildDirectory.dir("generated/toolchain/ccbaremetal")
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
// Translating clang to JVM bytecode takes minutes and gigabytes of heap, so it is done here, at build time, and the
// result (Chicory's cache entries) is bundled as ccbaremetal/jit/ - see ModuleCache.
sourceSets {
    jittool
}
dependencies {
    ["runtime", "wasm", "compiler"].each { jittoolImplementation "com.dylibso.chicory:${it}:${chicory_version}" }
}
def jitOut = layout.buildDirectory.dir("generated/jit")
var precompileToolchain = tasks.register("precompileToolchain", JavaExec) {
    description = "Translates the clang toolchain to JVM bytecode for the mod jar and writes the slim llvm.wasm"
    dependsOn assembleToolchain
    classpath = sourceSets.jittool.runtimeClasspath
    mainClass = "dev.ccbaremetal.jittool.Precompile"
    def full = layout.buildDirectory.file("llvm-full.wasm")
    def slim = layout.buildDirectory.file("toolchain-slim/llvm/llvm.wasm")
    inputs.file(full)
    inputs.files(sourceSets.jittool.runtimeClasspath)
    outputs.dir(jitOut)
    outputs.file(slim)
    maxHeapSize = "4g"
    args jitOut.get().dir("ccbaremetal/jit").asFile.absolutePath, full.get().asFile.absolutePath, slim.get().asFile.absolutePath
}
sourceSets.main.resources.srcDir(files(jitOut).builtBy(precompileToolchain))
sourceSets.main.resources.srcDir(files(rootfsOut).builtBy(zipRootfs))
sourceSets.main.resources.srcDir(files(layout.buildDirectory.dir("generated/toolchain")).builtBy(zipToolchain))
neoForge.ideSyncTask zipRootfs
neoForge.ideSyncTask zipToolchain
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Licenses travel with the jar (MPL-2.0 for the mod; Apache-2.0, MIT, ISC and the CCPL for what it bundles).
tasks.named("jar", Jar) {
    from(rootProject.file("LICENSE")) { rename { "LICENSE-ccbaremetal" } }
    from(rootProject.file("THIRD_PARTY.md"))
    from(rootProject.file("LICENSES")) { into "LICENSES" }
}

// The in-world GameTests are ours alone (not in git): they never go into the jar players get.
tasks.named('jar') {
    exclude 'dev/ccbaremetal/gametest/**', 'data/ccbaremetal/structure/**'
}
